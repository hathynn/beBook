# Render Blueprint – deploy 1 web service chạy cả API lẫn giao diện.
# Render dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: bebook
    runtime: node
    plan: free # đổi sang "starter" nếu truyện nhiều ảnh bị thiếu RAM
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Khoá cả trang bằng mật khẩu, dạng "user:password". Xoá dòng này nếu muốn mở công khai.
      - key: BASIC_AUTH
        sync: false
      - key: DOWNLOAD_LIMIT_PER_HOUR
        value: "10"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
